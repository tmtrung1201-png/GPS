<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body,#map{height:100%;margin:0} .leaflet-control-attribution{font-size:9px}</style></head>
<body><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map=L.map('map').setView([10.762622,106.660172],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let marker=null;
function setMarker(lat,lon){ if(marker) map.removeLayer(marker); marker=L.marker([lat,lon]).addTo(map); map.setView([lat,lon],15); }
map.on('click',function(e){setMarker(e.latlng.lat,e.latlng.lng); if(window.Android) Android.onMapClick(e.latlng.lat,e.latlng.lng);});
function goTo(lat,lon){setMarker(lat,lon);}
</script></body></html>
